<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - HyperAid</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head><body>
<script>
(function () {
  var saved = localStorage.getItem('rescueai-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<div class="auth-shell glass-card text-center">
  <div class="feature-icon accent mx-auto mb-3" style="width:60px;height:60px;font-size:1.5rem;"><i class="fa-solid fa-signal"></i></div>
  <h4>You're Offline</h4>
  <p class="text-muted-custom">This page hasn't been saved for offline use yet. Pages you've already visited - like your dashboard or emergency card - will still open normally.</p>
  <p class="text-muted-custom" style="font-size:.85rem;"><i class="fa-solid fa-triangle-exclamation text-accent me-1"></i>In a real emergency, call your local emergency number directly - don't wait on a signal.</p>
  <button class="btn btn-primary-solid w-100 mt-2" onclick="window.location.reload()">Try Again</button>
  <a href="/" class="btn btn-outline-primary w-100 mt-2">Go to Home</a>
</div>
</body></html>
