{% extends "base.html" %}
{% block title %}Create Account - HyperAid{% endblock %}
{% block content %}
<section>
  <div class="container">
    <div class="glass-card auth-shell">
      <div class="text-center mb-4">
        <span class="feature-icon accent mx-auto" style="width:50px;height:50px"><i class="fa-solid fa-user-plus"></i></span>
        <h3 class="mt-3 mb-0">Create your account</h3>
        <p class="text-muted-custom small">Set up your safety net in under a minute.</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label small">Full name</label>
          <input class="form-control" name="full_name" value="{{ form.get('full_name','') }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Email address</label>
          <input class="form-control" type="email" name="email" value="{{ form.get('email','') }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Phone number</label>
          <input class="form-control" name="phone" value="{{ form.get('phone','') }}">
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label small">Password</label>
            <input class="form-control" type="password" name="password" required minlength="6">
          </div>
          <div class="col-6 mb-3">
            <label class="form-label small">Confirm password</label>
            <input class="form-control" type="password" name="confirm_password" required minlength="6">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small">Security question (for password recovery)</label>
          <input class="form-control" name="security_question" placeholder="e.g. What is your pet's name?" value="{{ form.get('security_question','') }}">
        </div>
        <div class="mb-4">
          <label class="form-label small">Answer</label>
          <input class="form-control" name="security_answer">
        </div>
        <button class="btn btn-primary-solid w-100" type="submit">Create Account</button>
      </form>
      <p class="text-center small text-muted-custom mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
